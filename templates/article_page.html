<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Перший сайт</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename = 'style.css') }}">
</head>
<body>
    {% include 'menu.html' %}
    <div class="container">
        <h1 class="main-text">{{article.title}}</h1>
        {% if article.image %}
            <img style="max-width: 800px; max-height: 500px;" src="{{url_for('static', filename='img/' + article.image) }}" class="card-img-top" alt="...">
        {% endif %}
        <div class="card-title" style="white-space: pre-wrap; ">{{article.content | safe  }}</div>
        <p class="card-text">{{article.author}}</p>
        <p class="card-text">{{article.created_at}}</p>
    </div>
   
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
