<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Перший сайт</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename = 'style.css') }}">
</head>
<body>
    {% include 'menu.html' %}
    <div class="container">
        <h1 class="main-text">LogikaBlog</h1>
        <div class="d-flex flex-wrap gap-2">
         {% for article in articles %}
            <div class="card" style="width: 18rem;">
                {% if article.image %}
                     <img src="{{url_for('static', filename='img/' + article.image) }}" class="card-img-top" alt="...">
                {% endif %}
                <div class="card-body">
                    <h5 class="card-title">{{article.title}}</h5>
                    <p class="card-text">{{article.author}}</p>
                    <p class="card-text">{{article.created_at}}</p>
                    <a href="{{url_for('article_page', article_id = article.id)}}" class="btn btn-primary stretched-link">Читати</a>
                </div>
            </div>
         {% endfor %}
        </div>    
    
    </div>
   
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
