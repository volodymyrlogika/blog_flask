<header>
    <nav class="navbar navbar-expand-lg" style="background: black;"  data-bs-theme="dark">
  <div class="container">
    <a class="navbar-brand" href="#">
        
        LogikaBlog</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="/">Головна</a>
        </li>
       
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            Категорії
          </a>
          <ul class="dropdown-menu">
            {% for category in categories %}
            <li><a class="dropdown-item" href="/category/{{category.id}}">{{category.title}}</a></li>
            {% endfor %}
          </ul>
        </li>
      
      </ul>
      <form action="{{url_for('search_page')}}" class="d-flex" role="search">
        <input required name="search" class="form-control me-2" type="search" placeholder="Шукати статтю..." aria-label="Search"/>
        <button class="btn btn-outline-light" type="submit">Пошук</button>
      </form>
    </div>
  </div>
</nav>
</header>
